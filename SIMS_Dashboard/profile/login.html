
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMS - Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f3f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            padding: 35px;
            width: 320px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 4px 15px #0001;
        }

        h1 { color: #4557b8; }

        p { color: #555; line-height: 1.6; }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background: #4e7efa;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>SIMS</h1>
        <h2>You have logged out</h2>
        <p>You have left the SIMS dashboard.</p>
        <a href="index.html">Return to Dashboard</a>
    </div>
</body>
</html>
