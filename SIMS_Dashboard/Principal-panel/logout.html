
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logged Out | SIMS</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #f4f7fc;
    display: flex;
    justify-content: center;
    align-items: center;
}

.logout-container {
    width: 90%;
    max-width: 460px;
    background: white;
    padding: 45px 35px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

.logo {
    color: #1765b1;
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 30px;
}

.success-icon {
    width: 75px;
    height: 75px;
    margin: auto;
    border-radius: 50%;
    background: #e5f7ed;
    color: #23834d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    margin-bottom: 22px;
}

h1 {
    font-size: 24px;
    color: #263445;
    margin-bottom: 12px;
}

.message {
    color: #7b8798;
    font-size: 14px;
    line-height: 1.7;
    margin-bottom: 28px;
}

.login-btn {
    display: inline-block;
    background: #4f7fff;
    color: white;
    text-decoration: none;
    padding: 13px 28px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
}

.login-btn:hover {
    background: #3566e8;
}

.footer {
    color: #a0a8b5;
    font-size: 12px;
    margin-top: 30px;
}
</style>
</head>

<body>

<div class="logout-container">

    <div class="logo">SIMS</div>

    <div class="success-icon">✓</div>

    <h1>You Have Logged Out!</h1>

    <p class="message">
        You have successfully left the Principal Panel.
        Thank you for using SIMS.
        Please log in again to access your account.
    </p>

    <a href="../login.html" class="login-btn">
        Back to Login
    </a>

    <div class="footer">
        SIMS School Management System
    </div>

</div>

</body>
</html>
