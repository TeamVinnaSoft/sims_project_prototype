<!-- =========================
     MAIN CONTENT
========================= -->
<div class="main">
     <div class="topbar"> 
        <h3>Create New Schedule</h3>
    </div><br>
   
    <form>
        <div class="input-group">
            <label>Schedule Name:</label>
            <input type="text" placeholder="New Schedule name">
        </div><br>

        <div class="input-group">
            <label>Strat Date:</label>
            <input type="date" placeholder="schedule start date">
        </div><br>

         <div class="input-group">
            <label>End Date:</label>
            <input type="date" placeholder="schedule end date">
        </div><br>

         <div class="input-group">
            <label>Schedule Type:</label>
            <select>
                <option>Select Schedule type</option>
                <option>Regular</option>
                <option>Special</option>
            </select>
        </div><br>

        <div class="input-group">
            <label>Days Of Week:</label>
            <input type="checkbox" checked>Sun
            <input type="checkbox" checked>Mon
            <input type="checkbox" checked>Tue
            <input type="checkbox" checked>Wed
            <input type="checkbox" checked>Thu
            <input type="checkbox" checked>Fri
            <input type="checkbox" checked>Sat
        </div><br>
    </form>

    <a href="school_timings.html">
        <button class="view-btn" type="submit"> Create a schedule</button>
    </a>

    <a href="create_school_timings.html">
        <button class="view-btn-cancel" type="submit"> Cancel</button>
    </a>
